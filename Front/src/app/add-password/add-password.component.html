<div class="container">
  <form [formGroup]="accountForm" (ngSubmit)="onSubmit()">
    <h2>Create an Account</h2>

    <div class="form-group">
      <label for="accountName">Account Name</label>
      <input id="accountName" formControlName="accountName" type="text" class="form-control" placeholder="Enter your account name" />
      <div *ngIf="accountForm.get('accountName')?.invalid && accountForm.get('accountName')?.touched" class="error">
        Account name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="applicationType">Application Type</label>
      <select id="applicationType" formControlName="applicationType" class="form-control">
        <option value="" disabled selected>Select Application Type</option>
        <option *ngFor="let type of [1, 2]" [value]="type">
          {{ type === 1 ? 'Public' : 'Professional' }}
        </option>
      </select>
      <div *ngIf="accountForm.get('applicationType')?.invalid && accountForm.get('applicationType')?.touched" class="error">
        Application type is required.
      </div>
    </div>

    <div class="form-group">
      <label for="application">Application</label>
      <select id="application" formControlName="application" class="form-control">
        <option value="" disabled selected>Select an Application</option>
        <option *ngFor="let app of filteredApplications" [value]="app.id">
          {{ app.name }}
        </option>
      </select>
      <div *ngIf="accountForm.get('application')?.invalid && accountForm.get('application')?.touched" class="error">
        Application selection is required.
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" formControlName="password" type="password" class="form-control" placeholder="Enter your password" />
      <div *ngIf="accountForm.get('password')?.invalid && accountForm.get('password')?.touched" class="error">
        Password is required and must be at least 6 characters.
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="accountForm.invalid">Submit</button>
  </form>
  @if (isCreating){
    Création en cours...
  }
</div>
