<div class="table-container">
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Mot de passe chiffré</th>
      <th>ID de l'application</th>
      <th>Nom du compte</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
      @for (password of passwords; track password.id) {
        <tr>
          <td>{{ password.id }}</td>
          <td>{{ password.encryptedPassword }}</td>
          <td>{{ password.applicationId }}</td>
          <td>{{ password.accountName }}</td>
          <td>
            <button (click)="deletePassword(password.id)">Supprimer</button>
          </td>
        </tr>
      }
    </tbody>
    @if(isDeleting){
      Suppression en cours...
    }
  </table>
  <button routerLink="create">Créer un mdp</button>
</div>
